services:

  # ===========================================================================
  # STATION 1
  # ===========================================================================
  station1:
    build: .
    image: radio-showrunner:latest
    restart: unless-stopped
    environment:
      # --- Supabase ---
      SUPABASE_URL:                 ${STATION1_SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY:    ${STATION1_SERVICE_KEY}
      SUPABASE_STORAGE_BUCKET:      ${STATION1_BUCKET:-show-audio}

      # --- Icecast source ---
      ICE_HOST:                     ${STATION1_ICE_HOST}
      ICE_PORT:                     ${STATION1_ICE_PORT:-8025}
      ICE_DEFAULT_SOURCE_USER:      ${STATION1_ICE_USER}
      ICE_DEFAULT_SOURCE_PASS:      ${STATION1_ICE_PASS}
      AUTH_401_FAILOVER_THRESHOLD:  ${STATION1_AUTH_401_FAILOVER:-3}

      # --- Icecast admin kick ---
      ENABLE_ICECAST_ADMIN_KICK:    ${STATION1_ADMIN_KICK:-false}
      ICE_ADMIN_PROTO:              ${STATION1_ADMIN_PROTO:-http}
      ICE_ADMIN_HOST:               ${STATION1_ADMIN_HOST:-}
      ICE_ADMIN_PORT:               ${STATION1_ADMIN_PORT:-}
      ICE_ADMIN_USER:               ${STATION1_ADMIN_USER:-}
      ICE_ADMIN_PASS:               ${STATION1_ADMIN_PASS:-}
      ADMIN_KICK_BEFORE_START:      ${STATION1_KICK_BEFORE_START:-false}
      ADMIN_KICK_ON_ATTEMPT:        ${STATION1_KICK_ON_ATTEMPT:-0}

      # --- Now Playing ---
      NOWPLAYING_UPDATE_URL:        ${STATION1_NOWPLAYING_URL:-}
      NOWPLAYING_API_KEY:           ${STATION1_NOWPLAYING_KEY:-}

      # --- Scheduling ---
      STATION_TZ:                   ${STATION1_TZ:-UTC}
      PREFETCH_MS:                  ${STATION1_PREFETCH_MS:-0}
      SAFETY_RESYNC_MS:             ${STATION1_RESYNC_MS:-300000}
      PREEMPT_WAIT_MS:              ${STATION1_PREEMPT_WAIT_MS:-5000}
      PREEMPT_POLL_MS:              ${STATION1_PREEMPT_POLL_MS:-500}

      # --- Connection & retries ---
      RETRY_TOTAL_MS:               ${STATION1_RETRY_TOTAL_MS:-180000}
      RETRY_DELAY_MS:               ${STATION1_RETRY_DELAY_MS:-5000}
      CONNECT_GRACE_MS:             ${STATION1_CONNECT_GRACE_MS:-7000}
      RECONNECT_DELAY_MS:           ${STATION1_RECONNECT_DELAY_MS:-2000}

      # --- Streaming ---
      EOF_BEHAVIOR:                 ${STATION1_EOF_BEHAVIOR:-resume}
      ENABLE_LOCAL_COPY:            ${STATION1_LOCAL_COPY:-true}
      SIGNED_URL_TTL_SECS:          ${STATION1_SIGNED_URL_TTL:-3600}
      DOWNLOAD_RETRY_TOTAL_MS:      ${STATION1_DL_RETRY_TOTAL_MS:-600000}
      DOWNLOAD_RETRY_DELAY_MS:      ${STATION1_DL_RETRY_DELAY_MS:-5000}
      MAX_LOCAL_FILE_MB:            ${STATION1_MAX_FILE_MB:-2048}

      # --- Monitoring ---
      ENABLE_FFPROBE_DURATION_CHECK: ${STATION1_FFPROBE:-true}
      DURATION_WARN_PAD_SECS:       ${STATION1_DURATION_WARN_PAD:-5}
      LAST_ERROR_LIMIT:             ${STATION1_LAST_ERROR_LIMIT:-5}

      # --- Internal (fixed per container — do not change) ---
      HEALTH_PORT:    "8080"
      LOG_DIR:        /app/logs
      LOCAL_CACHE_DIR: /app/cache

    ports:
      - "${STATION1_HOST_PORT:-8080}:8080"
    volumes:
      - station1_cache:/app/cache
      - station1_logs:/app/logs


